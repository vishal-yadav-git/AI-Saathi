<!DOCTYPE html>
<html>
<head>
  <title>AI Saathi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white flex flex-col items-center justify-center h-screen">

<h1 class="text-3xl font-bold mb-2">🤖 AI Saathi</h1>
<p class="mb-4">Offline AI for Rural India</p>

<div class="bg-gray-800 p-4 rounded-xl w-96 shadow-lg">

    <!-- Modes -->
    <div class="flex gap-2 mb-3">
        <button onclick="setMode('education')" class="bg-blue-500 px-2 py-1 rounded">📚 Edu</button>
        <button onclick="setMode('health')" class="bg-red-500 px-2 py-1 rounded">🏥 Health</button>
        <button onclick="setMode('farmer')" class="bg-green-500 px-2 py-1 rounded">🌾 Farmer</button>
    </div>

    <!-- Chat -->
    <div id="chat" class="h-40 overflow-y-auto mb-2"></div>

    <!-- Input -->
    <input id="msg" class="w-full p-2 rounded text-black" placeholder="Kuch pucho...">

    <div class="flex gap-2 mt-2 flex-wrap">
        <button onclick="send()" class="bg-blue-600 px-3 py-1 rounded">Send</button>
        <button onclick="startVoice()" class="bg-yellow-500 px-3 py-1 rounded">🎤</button>
    </div>

    <!-- 📄 File Upload -->
    <div class="mt-3">
        <input type="file" id="fileInput" class="text-white">
        <button onclick="sendFile()" class="bg-purple-500 px-3 py-1 rounded mt-1">📄 Upload File</button>
    </div>

    <!-- 📷 Camera -->
    <div class="mt-3">
        <video id="video" width="100%" autoplay class="rounded"></video>
        <button onclick="captureImage()" class="bg-green-600 px-3 py-1 rounded mt-1">📷 Capture</button>
    </div>

</div>

<script>
let mode = "education";

function setMode(m){
    mode = m;
}

// 💬 Text Chat
function send(){
    let msg = document.getElementById("msg").value;

    fetch(`/chat?q=${msg}`)
    .then(r => r.json())
    .then(d => {
        document.getElementById("chat").innerHTML += 
        `<p><b>You:</b> ${msg}</p>
         <p><b>AI (${d.mode}):</b> ${d.response}</p>`;
    });
}

// 🎤 Voice
function startVoice(){
    let rec = new webkitSpeechRecognition();
    rec.lang = "hi-IN";

    rec.onresult = function(e){
        let text = e.results[0][0].transcript;
        document.getElementById("msg").value = text;
        send();
    }
    rec.start();
}

// 📄 File Upload
function sendFile(){
    let file = document.getElementById("fileInput").files[0];
    let formData = new FormData();
    formData.append("file", file);

    fetch("/image", {
        method: "POST",
        body: formData
    })
    .then(r=>r.json())
    .then(d=>{
        document.getElementById("chat").innerHTML += 
        `<p>📄 AI: ${d.response}</p>`;
    });
}

// 📷 Camera Setup
let video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    video.srcObject = stream;
});

// 📷 Capture Image
function captureImage(){
    let canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    let ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    canvas.toBlob(blob => {
        let formData = new FormData();
        formData.append("file", blob, "capture.png");

        fetch("/image", {
            method: "POST",
            body: formData
        })
        .then(r=>r.json())
        .then(d=>{
            document.getElementById("chat").innerHTML += 
            `<p>📷 AI: ${d.response}</p>`;
        });
    });
}
</script>

</body>
</html>
